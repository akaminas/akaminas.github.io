name: Publish the next blog post

# The clock. Every day the script looks at the repository: if 15 days have passed since the
# date of the last published post, it publishes the next draft (the one with the earliest
# date), commits that, and starts the deploy. On the other days it does nothing.
# A run can also be started by hand from the Actions tab, with "force" to publish at once.

on:
  schedule:
    - cron: '17 6 * * *' # every day at 06:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: Publish the next draft now, whatever the date of the last post
        type: boolean
        default: false

permissions:
  contents: write # to commit the published post
  actions: write # to start the deploy: a push made with the workflow token does not start it

concurrency:
  group: publish-next
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Publish the next draft if it is time
        id: next
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            node scripts/publish-next.mjs --every 15 --force
          else
            node scripts/publish-next.mjs --every 15
          fi

      - name: Commit and deploy
        if: steps.next.outputs.published != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.next.outputs.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/blog
          git commit -m "Publish: $TITLE"
          git push origin HEAD:main
          gh workflow run deploy.yml --ref main
