# Temporary: builds the restyle branch on GitHub and commits the output back,
# because the bundler's native binary cannot run on the author's machine.
name: Build check
on:
  push:
    branches: [restyle-ci]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        id: build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-output.txt
      - name: Build succeeded
        if: success()
        run: echo ok
      - name: Build failed
        if: failure()
        run: echo failed
      - name: Record result
        if: always()
        run: |
          git config user.name "build-bot"
          git config user.email "bot@example.invalid"
          git add -f build-output.txt
          [ -d dist ] && git add -f dist || true
          git commit -m "ci: build output [skip ci]" || echo "nothing to commit"
          git push
