<!doctype html>
<!--
  Social preview image template (1200×630). Render to public/og.png with a headless browser, e.g.:
    npx playwright screenshot --viewport-size=1200,630 scripts/og.html public/og.png
  (or open in a browser at 1200×630 and take a screenshot).
  Same look as the site: lavender bar, cream paper, mono name, slab text, and the island. Uses the same self-hosted fonts.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face { font-family: 'Roboto Slab'; src: url('../public/fonts/roboto-slab-latin-wght.woff2') format('woff2'); font-weight: 100 900; }
      @font-face { font-family: 'Roboto Mono'; src: url('../public/fonts/roboto-mono-latin-wght.woff2') format('woff2'); font-weight: 100 700; }
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #fbf6ef; color: #2a2440; font-family: 'Roboto Slab', Georgia, serif; }
      .bar { height: 64px; background: #cbbfe6; color: #3f2a73; font-family: 'Roboto Mono', monospace; font-size: 22px; display: flex; align-items: center; padding: 0 56px; gap: 40px; }
      .bar span + span { opacity: 0.85; font-size: 19px; }
      .wrap { position: relative; padding: 48px 56px 0; }
      h1 { font-family: 'Roboto Mono', monospace; font-weight: 500; font-size: 58px; margin: 0 0 8px; color: #33256b; letter-spacing: -0.01em; }
      p.role { font-family: 'Roboto Mono', monospace; font-size: 18px; color: #625a7a; margin: 0 0 26px; }
      p.lede { font-size: 24px; line-height: 1.45; max-width: 520px; margin: 0; }
      .island { position: absolute; right: -40px; top: -30px; width: 640px; }
      .island img { width: 100%; }
    </style>
  </head>
  <body>
    <div class="bar"><span>Alexandros Kaminas</span><span>Work · Methods · Publications · Teaching · About · CV</span></div>
    <div class="wrap">
      <h1>Alexandros Kaminas</h1>
      <p class="role">PhD researcher · TRÊS, University of Groningen</p>
      <p class="lede">Modelling complex systems: eco-evolutionary dynamics, community assembly and regime shifts, with applications to sustainability and socioeconomic systems.</p>
      <div class="island"><img src="../src/components/island.svg" alt="" /></div>
    </div>
  </body>
</html>
