<!doctype html>
<!--
  Social preview image template (1200×630). Render to public/og.png with
    python scripts/render-icons.py
  Same look as the site: Aegean-blue bar, white paper, monospaced name, slab text, and the island. Uses the same self-hosted fonts.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face { font-family: 'Roboto Slab'; src: url('../public/fonts/roboto-slab-latin-wght.woff2') format('woff2'); font-weight: 100 900; }
      @font-face { font-family: 'Roboto Mono'; src: url('../public/fonts/roboto-mono-latin-wght.woff2') format('woff2'); font-weight: 100 700; }
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #f4f4f4; color: #243541; font-family: 'Roboto Slab', Georgia, serif; }
      .bar { height: 64px; background: #007ba7; color: #f4f4f4; font-family: 'Roboto Mono', monospace; font-weight: 500; font-size: 17px; display: flex; align-items: center; padding: 0 56px; gap: 40px; }
      .bar span:first-child { font-size: 21px; }
      .bar span + span { opacity: 0.8; }
      .wrap { position: relative; padding: 52px 56px 0; }
      h1 { font-family: 'Roboto Mono', monospace; font-weight: 500; font-size: 54px; margin: 0 0 10px; color: #123b4f; letter-spacing: -0.01em; }
      p.role { font-family: 'Roboto Mono', monospace; font-weight: 500; font-size: 17px; color: #5a6b76; margin: 0 0 26px; }
      p.lede { font-size: 23px; line-height: 1.5; max-width: 520px; margin: 0; }
      .island { position: absolute; right: -50px; top: 10px; width: 600px; }
      .island img { width: 100%; }
    </style>
  </head>
  <body>
    <div class="bar"><span>Alexandros Kaminas</span><span>Work · Methods · Publications · Teaching · About · CV</span></div>
    <div class="wrap">
      <h1>Alexandros Kaminas</h1>
      <p class="role">PhD researcher · TRÊS, University of Groningen</p>
      <p class="lede">Modelling complex systems: eco-evolutionary dynamics, community assembly and regime shifts, with applications to sustainability and socioeconomic systems.</p>
      <div class="island"><img src="../src/components/island.svg" alt="" /></div>
    </div>
  </body>
</html>
