<!doctype html>
<!--
  Social preview image template (1200×630). Render to public/og.png with a headless browser, e.g.:
    npx playwright screenshot --viewport-size=1200,630 scripts/og.html public/og.png
  (or open in a browser at 1200×630 and take a screenshot).
  Uses the same self-hosted fonts as the site.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face { font-family: 'Plex Serif'; src: url('../public/fonts/ibm-plex-serif-latin-400-normal.woff2') format('woff2'); font-weight: 400; }
      @font-face { font-family: 'Plex Sans'; src: url('../public/fonts/ibm-plex-sans-latin-wght-normal.woff2') format('woff2-variations'); font-weight: 100 700; }
      @font-face { font-family: 'Plex Mono'; src: url('../public/fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2'); font-weight: 400; }
      html, body { margin: 0; width: 1200px; height: 630px; background: #f4f2ed; color: #191b1f; overflow: hidden; }
      .wrap { position: relative; width: 1200px; height: 630px; padding: 60px 80px; box-sizing: border-box; font-family: 'Plex Sans', sans-serif; }
      .eyebrow { font-family: 'Plex Mono', monospace; font-size: 20px; letter-spacing: 0.08em; text-transform: uppercase; color: #5b5f66; margin: 0 0 28px; }
      h1 { font-family: 'Plex Serif', serif; font-weight: 400; font-size: 84px; line-height: 1.02; letter-spacing: -0.02em; margin: 0 0 32px; max-width: 700px; }
      p { font-size: 26px; line-height: 1.35; max-width: 620px; margin: 0; color: #191b1f; }
      .name { position: absolute; left: 80px; bottom: 64px; font-family: 'Plex Serif', serif; font-size: 30px; }
      .url { position: absolute; right: 80px; bottom: 64px; font-family: 'Plex Mono', monospace; font-size: 20px; color: #5b5f66; }
      svg { position: absolute; right: 80px; top: 72px; }
      .rule { position: absolute; left: 80px; right: 80px; bottom: 120px; height: 1px; background: #d6d2c9; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p class="eyebrow">PhD researcher · TRÊS, University of Groningen</p>
      <h1>Modelling complex systems.</h1>
      <p>Mathematical and computational models of ecological, evolutionary and socioeconomic dynamics.</p>
      <svg width="300" height="300" viewBox="0 0 96 96" fill="none" aria-hidden="true">
        <circle cx="28" cy="48" r="20" stroke="#191b1f" stroke-width="0.8" opacity="0.7"/>
        <circle cx="70" cy="48" r="16" stroke="#191b1f" stroke-width="0.8" opacity="0.7"/>
        <g fill="#191b1f">
          <circle cx="22" cy="42" r="1.8"/><circle cx="31" cy="52" r="1.8"/><circle cx="35" cy="41" r="1.8"/>
          <circle cx="25" cy="56" r="1.8"/><circle cx="66" cy="44" r="1.8"/><circle cx="73" cy="53" r="1.8"/>
          <circle cx="18" cy="50" r="1.8"/><circle cx="29" cy="46" r="1.8"/><circle cx="70" cy="40" r="1.8"/>
        </g>
        <path d="M48 48 H54" stroke="#191b1f" stroke-width="0.8" stroke-dasharray="1.5 1.5"/>
        <circle cx="76" cy="41" r="2" fill="#a63e16"/>
      </svg>
      <div class="rule"></div>
      <div class="name">Alexandros Kaminas</div>
      <div class="url">akaminas.github.io</div>
    </div>
  </body>
</html>
