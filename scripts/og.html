<!doctype html>
<html lang="en">
<head>

<!-- Rendered to public/og.png at 1200 × 630 by scripts/render-assets.py. Fonts are the system's Palatino and Corbel, as on the site. -->
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #fff; color: #2a2825; font-family: Corbel, Lato, 'Segoe UI', sans-serif; position: relative; overflow: hidden; }

  .mark svg { width: 36px; height: 36px; }
  .text { position: absolute; left: 84px; top: 172px; width: 640px; }
  .eyebrow { font-family: Consolas, monospace; font-size: 17px; letter-spacing: .14em; text-transform: uppercase; color: #8a857c; margin: 0 0 22px; }
  h1 { font-family: 'Palatino Linotype', Palatino, serif; font-weight: 400; font-size: 80px; line-height: 1.02; letter-spacing: -.02em; margin: 0 0 24px; }
  p.lead { font-size: 27px; line-height: 1.4; color: #5a5650; margin: 0; max-width: 540px; }
  .url { position: absolute; left: 84px; bottom: 56px; font-family: Consolas, monospace; font-size: 17px; letter-spacing: .14em; text-transform: uppercase; color: #8a857c; }
  svg.art { position: absolute; right: 0; top: 0; width: 560px; height: 630px; }
</style>
</head>
<body>
  <div class="mark">
    <svg viewBox="0 0 32 32"><path d="M8.5 23 15.5 10 22.5 23Z M22.5 23 27.5 12.5" fill="none" stroke="#2a2825" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="8.5" cy="23" r="2.7" fill="#2a2825"/><circle cx="15.5" cy="10" r="2.7" fill="#2a2825"/><circle cx="22.5" cy="23" r="2.7" fill="#2a2825"/><circle cx="27.5" cy="12.5" r="3.2" fill="#304168" stroke="#fff" stroke-width="1.4"/></svg>
    <span>Alexandros Kaminas</span>
  </div>
  <div class="text">
    <p class="eyebrow">PhD researcher · University of Groningen</p>
    <h1>Alexandros Kaminas</h1>
    <p class="lead">Quantitative models of ecology, evolution and sustainability.</p>
  </div>
  <div class="url">akaminas.github.io</div>
  <svg class="art" id="art" viewBox="0 0 560 630" xmlns="http://www.w3.org/2000/svg"></svg>
  <script>
    // An isometric voxel cluster in Vellum teal, with two indigo blocks: the same drawing as the site's textures.
    (function () {
      var a = 7; function rnd() { a = (a + 0x6d2b79f5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
      var teal = { tint: '#A5D5D7', tone: '#419BA0', deep: '#004C50' }, indigo = { tint: '#BBCBEC', tone: '#415688', deep: '#304168' };
      var svg = document.getElementById('art'), out = '';
      out += '<defs><linearGradient id="l" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".14"/></linearGradient><linearGradient id="r" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".05"/><stop offset="1" stop-color="#000" stop-opacity=".22"/></linearGradient></defs>';
      function poly(p, fill) { return '<polygon points="' + p.map(function (q) { return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join(' ') + '" fill="' + fill + '" stroke="#fff" stroke-width=".9" stroke-linejoin="round"/>'; }
      function prism(x, y, h, s, c) {
        var T = [x, y - h * s], R = [x + s, y + s / 2 - h * s], B = [x, y + s - h * s], L = [x - s, y + s / 2 - h * s], Rb = [x + s, y + s / 2], Bb = [x, y + s], Lb = [x - s, y + s / 2];
        return poly([L, B, Bb, Lb], c.tone) + poly([L, B, Bb, Lb], 'url(#l)') + poly([B, R, Rb, Bb], c.deep) + poly([B, R, Rb, Bb], 'url(#r)') + poly([T, R, B, L], c.tint);
      }
      var u = 34, N = 9, ox = 300, oy = 330 - N * u / 2, cells = [];
      for (var i = 0; i < N; i++) for (var j = 0; j < N; j++) {
        var cx = i - 4, cy = j - 4, d = Math.hypot(cx, cy) / 4, mask = Math.max(0, 1 - d * d * 1.15);
        var n = 0.5 + 0.5 * Math.sin(i * 1.7 + j * 0.9) * Math.cos(j * 1.3 - i * 0.4);
        var h = Math.round((0.3 + n * 3.4) * mask);
        if (h > 0) cells.push([i, j, h]);
      }
      cells.sort(function (p, q) { return p[0] + p[1] - q[0] - q[1]; });
      var k = 0;
      cells.forEach(function (c) { k++; out += prism(ox + (c[0] - c[1]) * u, oy + (c[0] + c[1]) * u / 2, c[2], u, k % 11 === 0 ? indigo : teal); });
      out += prism(90, 120, 1, 22, teal) + prism(470, 90, 1, 18, indigo) + prism(120, 520, 1, 20, teal);
      svg.innerHTML = out;
    })();
  </script>
</body>
